name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no tokens stored anywhere.
# Trigger: publishing a GitHub Release (create a tag like v0.0.2, then a release).
# One-time PyPI setup required: project -> Manage -> Publishing -> add GitHub
# publisher (owner: satya1395, repo: reble, workflow: release.yml, environment: pypi).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --sdist --wheel
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
