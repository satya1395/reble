name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # install the CERTIFIED version set (full transitive freeze), then reble
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e . && pip install pytest
      - run: pytest tests/ -q
