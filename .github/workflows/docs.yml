name: docs

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs-site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Build the Astro/Starlight docs site (docs-site/) and deploy to GitHub
# Pages. PRs build + linkcheck without deploying. `linkcheck` asserts every
# internal link resolves in the built HTML — the mkdocs --strict equivalent.

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build
        run: |
          cd docs-site
          npm ci
          npm run build
          npm run linkcheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
