name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: reble
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # setup-uv's python-version input already created .venv (VIRTUAL_ENV);
        # uv pip targets it automatically.
        run: uv pip install -e ".[dev,mcp]"
      - name: Lint
        run: uv run ruff check src/reble/ tests/
      - name: Test
        run: uv run pytest tests/ -q
        env:
          REBLE_PG_TEST_URI: postgresql://postgres:reble@localhost:5432/postgres
