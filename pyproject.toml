[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reble"
version = "0.0.8"
description = "Your models are just SQL files. Branch your warehouse like you branch your code — local-first analytics on DuckDB + Iceberg + SQLGlot."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Reble contributors" }]
keywords = ["data-engineering", "iceberg", "duckdb", "sqlglot", "branching", "lakehouse", "data-diff", "analytics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    # exact pins: spikes double as upgrade regression tests (see spikes/*/RESULTS.md)
    "pyiceberg[sql-sqlite,pyarrow]==0.11.1",
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
    "sqlglot==30.8.0",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reble = "reble.cli:cli"

[project.urls]
Homepage = "https://github.com/satya1395/reble"

[tool.setuptools.packages.find]
where = ["src"]
